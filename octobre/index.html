<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sept à la Maison - Octobre</title>
    <style>
        :root {
            --bg-creme: #FDFBF7;
            --text-color: #3E3B35;
            --border-color: #EAE6DF;
            --accent-color: #A39274;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-creme);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            padding: 15px; 
            margin-bottom: 30px; 
            background-color: #ffffff; 
            border-radius: 8px;
        }
        header h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        header nav { display: flex; gap: 20px; }
        header nav a { color: var(--text-color); text-decoration: none; font-size: 0.9rem; font-weight: 500; }

        /* GRILLE CALENDRIER (8 colonnes parfaites) */
        .calendar-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Style de base des cases */
        .cell {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            position: relative;
            box-sizing: border-box;
        }

        /* Entêtes */
        .cell-month { background-color: #3E3B35; color: #ffffff; font-weight: bold; font-size: 0.9rem; text-align: center; }
        .cell-day { background-color: #F3EFE9; font-weight: 600; font-size: 0.9rem; }
        .cell-theme { background-color: #F9F6F0; font-style: italic; font-size: 0.85rem; text-align: center; padding: 5px; font-weight: bold; }

        /* Cases vides */
        .cell-empty {
            background-color: rgba(234, 230, 223, 0.2);
            border: 1px dashed var(--border-color);
        }

        /* --- EFFET 3D CARTE --- */
        .cell-future {
            perspective: 1000px;
            background-color: transparent !important;
            border: none !important;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        /* Rotation au survol ou via classe JS */
        .cell-future:hover .card-inner, .cell-future.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .card-front {
            background-color: #FBF9F4;
            color: var(--text-color);
        }
        .card-front::after {
            content: "✨";
            font-size: 1.5rem;
            opacity: 0.4;
        }
        .card-front .day-hint {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .card-back {
            background-color: #3E3B35;
            color: #ffffff;
            transform: rotateY(180deg);
            padding: 10px;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: #7A756C; }
    </style>
</head>
<body>

    <header>
        <h1>Sept à la maison</h1>
        <nav>
            <a href="./../">Accueil</a>
            <a href="../ressources.html">Ressources</a>
            <a href="../boutique.html">Boutique</a>
        </nav>
    </header>

    <div class="calendar-container">
        
        <!-- LIGNE 1 : Les Entêtes (8 éléments au total) -->
        <div class="cell cell-month">OCTOBRE</div>
        <div class="cell cell-day">Lun</div>
        <div class="cell cell-day">Mar</div>
        <div class="cell cell-day">Mer</div>
        <div class="cell cell-day">Jeu</div>
        <div class="cell cell-day">Ven</div>
        <div class="cell cell-day">Sam</div>
        <div class="cell cell-day">Dim</div>
               
        <!-- LIGNE 2 : Semaine Déco (1 Thème + 3 vides + 4 jours = 8 éléments) -->
        <div class="cell cell-theme">Semaine Déco</div>
        <div class="cell cell-empty"></div>
        <div class="cell cell-empty"></div>
        <div class="cell cell-empty"></div>
        
        <div class="cell cell-future" data-day="1" data-url="VOTRE_LIEN_AFFILIE_1">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">1</span></div>
                <div class="card-back">Message Secret 1</div>
            </div>
        </div>
        <div class="cell cell-future" data-day="2" data-url="VOTRE_LIEN_AFFILIE_2">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">2</span></div>
                <div class="card-back">Message Secret 2</div>
            </div>
        </div>
        <div class="cell cell-future" data-day="3" data-url="VOTRE_LIEN_AFFILIE_3">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">3</span></div>
                <div class="card-back">Message Secret 3</div>
            </div>
        </div>
        <div class="cell cell-future" data-day="4" data-url="VOTRE_LIEN_AFFILIE_4">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">4</span></div>
                <div class="card-back">Message Secret 4</div>
            </div>
        </div>

        <!-- LIGNE 3 : Semaine Cuisine (1 Thème + 7 jours = 8 éléments) -->
        <div class="cell cell-theme">Semaine Cuisine</div>
        <div class="cell cell-future" data-day="5" data-url="VOTRE_LIEN_AFFILIE_5">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">5</span></div>
                <div class="card-back">Recette Secrète 5</div>
            </div>
        </div>
        <div class="cell cell-future" data-day="6" data-url="VOTRE_LIEN_AFFILIE_6">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">6</span></div>
                <div class="card-back">Recette Secrète 6</div>
            </div>
        </div>
        <div class="cell cell-future" data-day="7" data-url="VOTRE_LIEN_AFFILIE_7">
            <div class="card-inner">
                <div class="card-front"><span class="day-hint">7</span></div>
                <div class="card-back">Recette Secrète 7</div>
            </div>
        </div>
        <!-- Vous pouvez continuer à ajouter vos jours ici (jusqu'à 11 pour finir la ligne) -->

    </div>

    <footer>
        <p>© 2026 Sept à la Maison - Tous droits réservés.</p>
    </footer>
<script>
        document.querySelectorAll('.cell-future').forEach(card => {
            card.addEventListener('click', function(e) {
                // Si la carte n'est pas encore retournée, on la retourne
                if (!this.classList.contains('flipped')) {
                    this.classList.add('flipped');
                } else {
                    // Si elle est déjà retournée, on ouvre le lien affilié
                    const url = this.getAttribute('data-url');
                    if (url && url !== '#' && !url.startsWith('LIEN_')) {
                        window.open(url, '_blank');
                    }
                }
            });
        });
    </script>
</body>
</html>
