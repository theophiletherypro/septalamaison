<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page en préparation - Sept à la Maison</title>
    <style>
        :root {
            --bg-creme: #FDFBF7;
            --text-color: #3E3B35;
            --border-color: #EAE6DF;
            --accent-color: #A39274;
            --swello-semaine: #401521;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-creme); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; text-align: center; }
        .container { max-width: 600px; padding: 40px 20px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); margin: 20px; }
        .icon { font-size: 3.5rem; margin-bottom: 20px; display: block; }
        h1 { font-size: 2rem; text-transform: uppercase; letter-spacing: 1px; color: var(--swello-semaine); margin-top: 0; margin-bottom: 15px; }
        p { color: #7A756C; font-size: 1.05rem; line-height: 1.6; margin-bottom: 30px; }
        .btn-back { display: inline-block; background-color: var(--text-color); color: #ffffff; text-decoration: none; padding: 14px 28px; font-size: 1rem; border-radius: 30px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 6px 15px rgba(62, 59, 53, 0.15); transition: transform 0.2s, background-color 0.2s; }
        .btn-back:hover { transform: translateY(-2px); background-color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🍂</span>
        <h1>Cette page est en préparation !</h1>
        <p>Vous avez cliqué sur un mois ou un onglet qui n'est pas encore disponible. Notre almanach se construit jour après jour, au fil des saisons.<br><br>En attendant, venez découvrir les inspirations déjà disponibles pour le mois en cours !</p>
       <a href="/novembre/" class="btn-back">Découvrir Novembre 2026 →</a>
    </div>
</body>
</html>
