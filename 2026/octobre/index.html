<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sept à la Maison - Octobre</title>
    <style>
        :root {
            --bg-creme: #FDFBF7;
            --text-color: #3E3B35;
            --border-color: #EAE6DF;
            --accent-color: #A39274;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-creme);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        header h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }
        header nav a { color: var(--text-color); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }

        /* GRILLE CALENDRIER */
        .calendar-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Style de base des cases */
        .cell {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Entêtes */
        .cell-month { background-color: #3E3B35; color: #ffffff; font-weight: bold; }
        .cell-day { background-color: #F3EFE9; font-weight: 600; font-size: 0.9rem; }
        .cell-theme { background-color: #F9F6F0; font-style: italic; font-size: 0.85rem; text-align: center; padding: 5px; }

        /* Cases vides (Début et fin de mois) */
        .cell-empty {
            background-color: rgba(234, 230, 223, 0.2);
            border: 1px dashed var(--border-color);
        }

        /* Cases jours actifs & cliquables */
        .cell-link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cell-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(163, 146, 116, 0.15);
        }

        /* Style des images .webp */
        .cell img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

   /* --- EFFET 3D CARTE QUI SE RETOURNE (FUTUR) --- */
.cell-future {
    perspective: 1000px; /* Crée l'effet de profondeur 3D */
    background-color: transparent !important;
    border: none !important;
    cursor: pointer;
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
}

/* Classe déclenchée au survol ou au clic en JavaScript */
.cell-future:hover .card-inner, .cell-future.flipped .card-inner {
    transform: rotateY(180deg);
}

/* Face Avant et Face Arrière */
.card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* Face Avant : Fond crème avec un point d'interrogation discret et le numéro du jour */
.card-front {
    background-color: #FBF9F4;
    color: var(--text-color);
}
.card-front::after {
    content: "✨";
    font-size: 1.5rem;
    opacity: 0.4;
}
.card-front .day-hint {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--accent-color);
}

/* Face Arrière : Le message secret */
.card-back {
    background-color: #3E3B35;
    color: #ffffff;
    transform: rotateY(180deg);
    padding: 15px;
    font-size: 0.85rem;
    line-height: 1.4;
}

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: #7A756C; }
    </style>
</head>
<body>

    <header>
        <h1>Sept à la maison</h1>
        <nav><a href="../../index.html">Accueil</a></nav>
    </header>

    <div class="calendar-container">
        
        <!-- LIGNE 1 : Les Entêtes -->
        <div class="cell cell-month">OCTOBRE</div>
        <div class="cell cell-day">Lun</div>
        <div class="cell cell-day">Mar</div>
        <div class="cell cell-day">Mer</div>
        <div class="cell cell-day">Jeu</div>
        <div class="cell cell-day">Ven</div>
        <div class="cell cell-day">Sam</div>
        <div class="cell cell-day">Dim</div>
               <!-- LIGNE 2 : Semaine Déco (Octobre commence un Jeudi = 3 cases vides au début) -->
        <div class="cell cell-theme">Semaine Déco</div>
        <div class="cell cell-empty"></div> <!-- Lundi -->
        <div class="cell cell-empty"></div> <!-- Mardi -->
        <div class="cell cell-empty"></div> <!-- Mercredi -->
        <div class="cell cell-calendar-day" data-day="1" data-url="VOTRE_LIEN_AFFILIE_1"><div class="card-inner"><div class="card-front"><span class="day-hint">1</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="2" data-url="VOTRE_LIEN_AFFILIE_2"><div class="card-inner"><div class="card-front"><span class="day-hint">2</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="3" data-url="VOTRE_LIEN_AFFILIE_3"><div class="card-inner"><div class="card-front"><span class="day-hint">3</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="4" data-url="VOTRE_LIEN_AFFILIE_4"><div class="card-inner"><div class="card-front"><span class="day-hint">4</span></div><div class="card-back"></div></div></div>

        <!-- LIGNE 3 : Semaine Cuisine (Jours 5 à 11) -->
        <div class="cell cell-theme">Semaine Cuisine</div>
        <div class="cell cell-calendar-day" data-day="5" data-url="VOTRE_LIEN_AFFILIE_5"><div class="card-inner"><div class="card-front"><span class="day-hint">5</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="6" data-url="VOTRE_LIEN_AFFILIE_6"><div class="card-inner"><div class="card-front"><span class="day-hint">6</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="7" data-url="VOTRE_LIEN_AFFILIE_7"><div class="card-inner"><div class="card-front"><span class="day-hint">7</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="8" data-url="VOTRE_LIEN_AFFILIE_8"><div class="card-inner"><div class="card-front"><span class="day-hint">8</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="9" data-url="VOTRE_LIEN_AFFILIE_9"><div class="card-inner"><div class="card-front"><span class="day-hint">9</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="10" data-url="VOTRE_LIEN_AFFILIE_10"><div class="card-inner"><div class="card-front"><span class="day-hint">10</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="11" data-url="VOTRE_LIEN_AFFILIE_11"><div class="card-inner"><div class="card-front"><span class="day-hint">11</span></div><div class="card-back"></div></div></div>

        <!-- LIGNE 4 : Côté Jardin (Jours 12 à 18) -->
        <div class="cell cell-theme">Côté Jardin</div>
        <div class="cell cell-calendar-day" data-day="12" data-url="VOTRE_LIEN_AFFILIE_12"><div class="card-inner"><div class="card-front"><span class="day-hint">12</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="13" data-url="VOTRE_LIEN_AFFILIE_13"><div class="card-inner"><div class="card-front"><span class="day-hint">13</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="14" data-url="VOTRE_LIEN_AFFILIE_14"><div class="card-inner"><div class="card-front"><span class="day-hint">14</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="15" data-url="VOTRE_LIEN_AFFILIE_15"><div class="card-inner"><div class="card-front"><span class="day-hint">15</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="16" data-url="VOTRE_LIEN_AFFILIE_16"><div class="card-inner"><div class="card-front"><span class="day-hint">16</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="17" data-url="VOTRE_LIEN_AFFILIE_17"><div class="card-inner"><div class="card-front"><span class="day-hint">17</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="18" data-url="VOTRE_LIEN_AFFILIE_18"><div class="card-inner"><div class="card-front"><span class="day-hint">18</span></div><div class="card-back"></div></div></div>

        <!-- LIGNE 5 : Loisirs Famille (Jours 19 à 25) -->
        <div class="cell cell-theme">Loisirs Famille</div>
        <div class="cell cell-calendar-day" data-day="19" data-url="VOTRE_LIEN_AFFILIE_19"><div class="card-inner"><div class="card-front"><span class="day-hint">19</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="20" data-url="VOTRE_LIEN_AFFILIE_20"><div class="card-inner"><div class="card-front"><span class="day-hint">20</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="21" data-url="VOTRE_LIEN_AFFILIE_21"><div class="card-inner"><div class="card-front"><span class="day-hint">21</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="22" data-url="VOTRE_LIEN_AFFILIE_22"><div class="card-inner"><div class="card-front"><span class="day-hint">22</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="23" data-url="VOTRE_LIEN_AFFILIE_23"><div class="card-inner"><div class="card-front"><span class="day-hint">23</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="24" data-url="VOTRE_LIEN_AFFILIE_24"><div class="card-inner"><div class="card-front"><span class="day-hint">24</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="25" data-url="VOTRE_LIEN_AFFILIE_25"><div class="card-inner"><div class="card-front"><span class="day-hint">25</span></div><div class="card-back"></div></div></div>

        <!-- LIGNE 6 : Bien-être (Jours 26 à 31 + 1 case vide finale pour fermer la grille à 8 colonnes) -->
        <div class="cell cell-theme">Bien-être</div>
        <div class="cell cell-calendar-day" data-day="26" data-url="VOTRE_LIEN_AFFILIE_26"><div class="card-inner"><div class="card-front"><span class="day-hint">26</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="27" data-url="VOTRE_LIEN_AFFILIE_27"><div class="card-inner"><div class="card-front"><span class="day-hint">27</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="28" data-url="VOTRE_LIEN_AFFILIE_28"><div class="card-inner"><div class="card-front"><span class="day-hint">28</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="29" data-url="VOTRE_LIEN_AFFILIE_29"><div class="card-inner"><div class="card-front"><span class="day-hint">29</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="30" data-url="VOTRE_LIEN_AFFILIE_30"><div class="card-inner"><div class="card-front"><span class="day-hint">30</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-calendar-day" data-day="31" data-url="VOTRE_LIEN_AFFILIE_31"><div class="card-inner"><div class="card-front"><span class="day-hint">31</span></div><div class="card-back"></div></div></div>
        <div class="cell cell-empty"></div> <!-- Case grise finale de fermeture -->

    </div> <!-- Fin de la grille calendar-container -->

    <!-- PIED DE PAGE CONVENTIONNEL -->
    <footer>
        <p>&copy; 2026 Sept à la maison - Partenaire Amazon.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Calcul de la date du jour actuelle (Fuseau Horaire Paris)
            const dateParis = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Paris"}));
            const today = dateParis.getDate(); 
            
            // Le script analyse les 31 cases de manière automatique
            document.querySelectorAll(".cell-calendar-day").forEach(card => {
                const day = parseInt(card.getAttribute("data-day"));
                const targetUrl = card.getAttribute("data-url");
                const backFace = card.querySelector(".card-back");

                if (day <= today) {
                    // 1. JOURS EN COURS OU PASSÉS : On affiche l'image et on active le lien affilié
                    card.className = "cell cell-link";
                    card.innerHTML = `<img src="images/${day.toString().padStart(2, '0')}.webp" alt="Inspiration ${day}">`;
                    card.addEventListener("click", () => {
                        window.open(targetUrl, '_blank');
                    });
                } else {
                    // 2. JOURS FUTURS : On active le mode "Carte retournable"
                    card.className = "cell cell-future";
                    
                    if (day === today + 1) {
                        // C'est la case de demain
                        backFace.innerHTML = "<p>☕ Revenez demain pour découvrir cette inspiration !</p>";
                    } else {
                        // C'est pour après-demain ou plus tard dans le mois
                        backFace.innerHTML = "<p>✨ Un peu de patience... Cette case s'ouvrira bientôt !</p>";
                    }

                    // Permet de retourner la carte au clic (indispensable sur mobile)
                    card.addEventListener("click", () => {
                        card.classList.toggle("flipped");
                    });
                }
            });
        });
    </script>
</body>
</html>
