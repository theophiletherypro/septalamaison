<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sept à la Maison - Calendrier de Novembre Interactif</title>
    
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="description" content="Découvrez nos inspirations quotidiennes, astuces d'organisation et sélections de saison pour la maison.">
    
    <meta property="og:title" content="Sept à la Maison - Calendrier de Novembre">
    <meta property="og:description" content="Inspirations quotidiennes et astuces d'organisation pour la maison.">
    <meta property="og:type" content="website">

    <!-- Liaison vers votre feuille de style existante d'Octobre -->
    <link rel="stylesheet" href="../octobre/css/style.css">
    <!-- Liaison vers les styles spécifiques de Novembre (ajouts de la grille) -->
    <link rel="stylesheet" href="css/style-novembre.css">
</head>
<body>

    <!-- Entête du site strict miroir -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); background-color: #ffffff; margin:-20px -20px 20px -20px; padding: 15px 20px;">
        <h1 style="margin: 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; color: var(--swello-semaine);">Sept à la maison</h1>
        <nav style="display: flex; gap: 20px;">
            <a href="./../" style="color: var(--text-color); text-decoration: none; font-weight: 500;">Accueil</a>
            <a href="../ressources.html" style="color: var(--text-color); text-decoration: none; font-weight: 500;">Ressources</a>
            <a href="../boutique.html" style="color: var(--text-color); text-decoration: none; font-weight: 500;">Boutique</a>
        </nav>
    </header>

    <!-- Titre Principal -->
    <div style="max-width: 1400px; margin: 30px auto 15px auto; padding: 0 10px;">
        <h2 style="font-size: 2.2rem; font-weight: 800; color: var(--swello-semaine); margin: 0; font-family: sans-serif;">Novembre 2026</h2>
    </div>

    <!-- Structure bi-colonne Swello -->
    <main class="main-layout">
        <section class="calendar-wrapper">
            <div class="calendar-grid" id="calendar-grid">
                <!-- Les en-têtes de jours et les 30 cases seront générés proprement par le script JS -->
            </div>
        </section>

        <aside class="sidebar-notes">
            <div style="background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; padding: 25px;">
                <h3 style="color: var(--swello-semaine); font-size: 1.2rem; text-transform: uppercase; margin-top: 0; margin-bottom: 5px;">Le Conseil du Mois</h3>
                <div style="height: 2px; width: 40px; background: var(--swello-weekend); margin-bottom: 15px;"></div>
                <p style="font-size: 0.9rem; line-height: 1.6; color: #6E6A62; margin-bottom: 10px;"><strong>Réchauffez l'atmosphère :</strong></p>
                <p style="font-size: 0.85rem; line-height: 1.6; color: #6E6A62;">En novembre, l'éclairage indirect devient la clé d'un intérieur chaleureux. Multipliez les bougies et lampes tamisées nomades pour transformer votre salon en un refuge réconfortant. 🕯️</p>
            </div>
        </aside>
    </main>

    <!-- Liaison vers votre script de Novembre -->
    <script src="js/app.js"></script>
</body>
</html>
